<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы - Chess Game</title>
    <meta name="description" content="Классическая игра в шахматы с красивым дизайном">
    <meta name="theme-color" content="#2c3e50">
    
    <!-- PWA манифест -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Иконки -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♔</text></svg>">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Стили -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="title">♔ Шахматы</h1>
            <div class="header-controls">
                <button id="installBtn" class="install-btn" style="display: none;">
                    📱 Установить приложение
                </button>
                <div class="game-info">
                    <div class="current-player">
                        <span class="player-label">Ход:</span>
                        <span id="currentPlayer" class="player-name">Белые</span>
                    </div>
                    <div class="game-status">
                        <span id="gameStatus" class="status-text">Игра идет</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="game-container">
                <div class="chess-board" id="chessBoard">
                    <!-- Шахматная доска будет сгенерирована JavaScript -->
                </div>
                
                <div class="game-controls">
                    <button id="newGameBtn" class="control-btn primary">
                        🆕 Новая игра
                    </button>
                    <button id="undoBtn" class="control-btn secondary">
                        ↩️ Отменить ход
                    </button>
                    <button id="flipBoardBtn" class="control-btn hint">
                        🔄 Перевернуть доску
                    </button>
                </div>

                <div class="move-history">
                    <h3>История ходов</h3>
                    <div id="moveHistory" class="history-list">
                        <!-- История ходов будет добавлена JavaScript -->
                    </div>
                </div>
            </div>

            <div class="game-over-popup" id="gameOverPopup">
                <div class="game-over-content">
                    <h2 id="gameOverTitle">🎉 Игра окончена!</h2>
                    <p id="gameOverMessage">Победитель: <span id="winner"></span></p>
                    <div class="game-over-stats">
                        <div>Ходов: <span id="totalMoves"></span></div>
                        <div>Время: <span id="gameTime"></span></div>
                    </div>
                    <button id="playAgainBtn" class="control-btn primary">
                        Играть снова
                    </button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Классическая игра в шахматы с современным дизайном</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
