<!doctype html>
<html lang="ru">
<head>

<title>🐸 Жаба-офлайн (HTML-версия)</title>
<style>
  :root{
    --bg:#0f1a14;
    --bg2:#152821;
    --panel:#1c3327;
    --panel2:#214030;
    --line:#2e5a44;
    --accent:#7ed957;
    --accent2:#b4ff5a;
    --warn:#ffb648;
    --bad:#ff6868;
    --good:#7ed957;
    --text:#e8f5e9;
    --muted:#9fbfa9;
    --gold:#ffd24a;
    --silver:#cfd7dc;
    --bronze:#d49a5a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:linear-gradient(180deg,#0c1410,#102016 60%,#0a130d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
  header .balance{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
  header .balance span{background:#0e1a13;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
  nav.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:54px;z-index:9}
  nav.tabs button{background:#0e1a13;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer;font-size:14px}
  nav.tabs button.active{background:var(--accent);color:#0d1d12;border-color:var(--accent2);font-weight:700}
  main{flex:1;padding:14px;max-width:1100px;width:100%;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .panel h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:8px}
  .panel h3{margin:14px 0 6px;font-size:14px;color:var(--accent2)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .col{flex:1 1 240px;min-width:0}
  .btn{background:var(--accent);color:#0d1d12;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
  .btn:hover{background:var(--accent2)}
  .btn:disabled{background:#3a4a40;color:#7a8a80;cursor:not-allowed}
  .btn.alt{background:#28533c;color:var(--text)}
  .btn.alt:hover{background:#316a4c}
  .btn.warn{background:#7a4a1f;color:#ffd9a8}
  .btn.bad{background:#7a2222;color:#ffd0d0}
  .btn.small{padding:5px 8px;font-size:12px}
  .bar{height:10px;background:#0a1410;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
  .bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
  .bar.hp > div{background:linear-gradient(90deg,#ff6868,#ffaaaa)}
  .bar.mood > div{background:linear-gradient(90deg,#ffd24a,#fff0a0)}
  .stat{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0}
  .stat .lbl{color:var(--muted);min-width:120px}
  .stat .val{font-weight:600}
  .pet-card{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .pet-photo{width:140px;height:140px;border-radius:14px;background:#0a1410 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%237ed957'/><circle cx='35' cy='38' r='9' fill='white'/><circle cx='65' cy='38' r='9' fill='white'/><circle cx='35' cy='38' r='4' fill='black'/><circle cx='65' cy='38' r='4' fill='black'/><path d='M30 60 Q50 80 70 60' stroke='%23114d22' fill='none' stroke-width='4' stroke-linecap='round'/></svg>") center/cover no-repeat;border:1px solid var(--line);flex-shrink:0}
  .pet-info{flex:1 1 240px;min-width:0}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .item{background:#0e1a13;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:13px;display:flex;flex-direction:column;gap:4px}
  .item .name{font-weight:600;color:var(--accent2)}
  .item .desc{color:var(--muted);font-size:12px}
  .item .row{margin-top:6px}
  .log{background:#0a1410;border:1px solid var(--line);border-radius:9px;padding:10px;height:240px;overflow-y:auto;font-size:13px;font-family:ui-monospace,monospace;line-height:1.5}
  .log .l{padding:3px 0;border-bottom:1px dashed #1c3327}
  .log .l:last-child{border:0}
  .tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line);background:#0e1a13;margin-right:4px}
  .tag.gold{color:var(--gold);border-color:#806010}
  .tag.silver{color:var(--silver);border-color:#445}
  .tag.bronze{color:var(--bronze);border-color:#553}
  .cd{font-size:12px;color:var(--muted)}
  .cd.ready{color:var(--good);font-weight:600}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
  .toast-wrap{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:200;max-width:90%}
  .toast{background:#1f3a2c;border:1px solid var(--accent);color:#e9ffe0;padding:8px 12px;border-radius:8px;font-size:13px;box-shadow:0 6px 14px rgba(0,0,0,.4);animation:fadein .2s ease}
  @keyframes fadein{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
  .frog-emoji{font-size:88px;text-align:center;line-height:140px}
  .inline{display:inline-flex;gap:4px;align-items:center}
  .table{width:100%;border-collapse:collapse;font-size:13px}
  .table th,.table td{padding:5px 6px;border-bottom:1px dashed #2a4a36;text-align:left}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;background:#0e1a13;border:1px solid var(--line);font-size:12px}
  .pill.good{color:var(--good);border-color:#3a7a40}
  .pill.bad{color:var(--bad);border-color:#7a3a3a}
  .pill.warn{color:var(--warn);border-color:#7a5a2a}
  .pill.gold{color:var(--gold);border-color:#7a5a10}
  .frog-mood{font-size:24px}
  .mini-input{background:#0a1410;border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px}
  .equip-slot{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#0e1a13;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
  .equip-slot .nm{display:flex;gap:6px;align-items:center}
  .equip-slot .dur{color:var(--muted);font-size:12px}
  .help{color:var(--muted);font-size:12px;line-height:1.5}
  .head-grad{background:linear-gradient(90deg,#1f4030,#1c3327);padding:14px;border-radius:12px;border:1px solid var(--line);margin-bottom:14px}
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .ach{background:#0e1a13;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px;opacity:.55}
  .ach.b{opacity:1;border-color:#a06822}
  .ach.s{opacity:1;border-color:#9aa6ac}
  .ach.g{opacity:1;border-color:#d4af1d;box-shadow:0 0 0 1px #806010 inset}

  .scroll-x{overflow-x:auto}
  @media (max-width:540px){
    header h1{font-size:14px}
    header .balance{font-size:12px}
    nav.tabs button{padding:6px 9px;font-size:12px}
    .pet-photo{width:110px;height:110px}
  }
</style>
</head>

const TICK_MS = 1000;            // 1 реальная секунда = 1 игровая минута
const SAVE_KEY = "toadgame_v1";

const now = () => Date.now();

// Игровые "часы": все таймеры считаются в игровых минутах
function gameMinutes(){ return Math.floor((now() - S.startedAt)/TICK_MS); }
function fmtCD(targetMin){
  const left = targetMin - gameMinutes();
  if(left<=0) return "готово";
  const h = Math.floor(left/60), m = left%60;
  return (h?h+"ч ":"")+m+"м";
}
function ready(targetMin){ return gameMinutes() >= targetMin; }
function setCD(hours){ return gameMinutes() + Math.round(hours*60); }

const rng = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b)=> Math.max(a,Math.min(b,v));

/* ===================== СТЕЙТ ===================== */

let S;

  return {
    startedAt: now(),
    name:"Жаба",
    photo:"🐸",
    level:1,
    fill:0, fillMax:5, fillNext:5,    // сытость = опыт

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null }
}
function reset(){
  if(!confirm("Уверен? Это сбросит сохранение.")) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

/* ===================== УТИЛИТЫ UI ===================== */

function log(t){
  S.log.unshift("["+fmtClock()+"] "+t);
  S.log = S.log.slice(0,200);
}
function fmtClock(){
  const m = gameMinutes();
  const d = Math.floor(m/(24*60));
  const hh = Math.floor((m%(24*60))/60);
  const mm = m%60;
  return (d?"д"+d+" ":"")+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}
function modal(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
document.getElementById("modal").addEventListener("click", e=>{
  if(e.target.id==="modal") closeModal();
});

function combatStats(actor){
  // actor: S (главная жаба) или фейковый противник
  if(!actor.equip){ // npc
    return {atk:actor.atk, def:actor.def, hp:actor.hp, hpMax:actor.hpMax};
  }
  let atk = Math.floor(actor.level/2)+2; // база
  let def = 0;
  let hpBonus = 0;
  for(const slot in actor.equip){
    const e = actor.equip[slot];
    if(!e || e.durability<=0) continue;
    const meta = GEAR_CRAFTS.find(g=>g.id===e.craftId);
    if(!meta) continue;
    if(meta.slot==="melee"||meta.slot==="ranged") atk += meta.bonus;
    else if(meta.slot==="boots") def += meta.bonus;
    else { hpBonus += meta.bonus; def += Math.floor(meta.bonus/3); }
  }
  // модификаторы
  for(const slot in actor.mods){
    const mods = actor.mods[slot]||[];
    const dmg = mods.filter(m=>m==="dmg").length;
    if(dmg>=3) atk += 10; else if(dmg===2) atk += 8; else if(dmg===1) atk += 5;
    const armor = mods.filter(m=>m==="armor").length;
    if(armor>=3) def += 10; else if(armor===2) def += 7; else if(armor===1) def += 4;
  }
  // класс
  if(actor.cls==="rogue") atk = Math.round(atk*1.15);
  if(actor.cls==="artisan") def += 5;
  // банда (доп.урон считается в активации)
  return {
    atk, def,
    hp: actor.hp,
    hpMax: 10 + Math.floor(actor.level/2) + hpBonus,
  };
}

function makeEnemy(level){
  level = Math.max(1, level + rng(-1, 2));
  const atk = 2 + Math.floor(level/2) + rng(0,3);
  const def = Math.floor(level/3) + rng(0,2);
  const hpMax = 10 + level*2 + rng(0,4);
  return {
    name: pick(["Жабер","Болотик","Квак-квак","Лягуш","Тритоныч","Жабэн","Болотный сосед","Лягвиния","Жабарь","Прыг"])+" #"+rng(10,99),
    level, atk, def, hp:hpMax, hpMax,
    bandChance: chance(0.3) ? (chance(0.3)?0.07:0.06) : 0,
    bandMult: chance(0.4)? 2 : 1,
    photo:pick(FROG_EMOJIS),
  };
}

function attackRound(me, enemy, logArr){
  // одновременно бьём
  const myStats = combatStats(me);
  const enStats = combatStats(enemy);

  let myDmg = rng(Math.floor(myStats.atk/2), myStats.atk);
  let enDmg = rng(Math.floor(enStats.atk/2), enStats.atk);

  // банда
  if(me.band){
    const ch = (me.band.loyalty<30?0.05:me.band.loyalty<80?0.06:0.07) + (me.cls==="rogue"?0.02:0);
    if(chance(ch)){
      const mult = me.band.type==="heron"?2:1;
      myDmg = Math.round(myDmg*(1+mult));
      logArr.push("🏋️ Банда атакует! Урон ×"+(1+mult));
      me.band.loyalty = clamp(me.band.loyalty-2,0,me.band.maxLoyalty||100);
    }
  }
  if(enemy.bandChance && chance(enemy.bandChance)){
    enDmg = Math.round(enDmg*(1+enemy.bandMult));
    logArr.push("🦩 Банда соперника атакует! Урон ×"+(1+enemy.bandMult));
  }

  // ассасин — уклонение
  if(me.cls==="assassin" && chance(0.10)){ enDmg=0; logArr.push("🦹 Ты уклонился!"); }

  // школьное/устрашающее снаряжение — +50% урона оружия 1 ход (упрощено)
  // crocoblock perk
  function blockChance(actor){
    let p=0;
    for(const slot of ["helmet","chest","boots"]){
      const e=actor.equip&&actor.equip[slot];
      if(!e) continue;
      const meta=GEAR_CRAFTS.find(g=>g.id===e.craftId);
      if(meta && meta.perk==="crocoblock") p+=0.0333;
    }
    return p;
  }
  if(blockChance(me)>0 && chance(blockChance(me))){ enDmg=0; logArr.push("🐊 Кроко-броня поглотила удар!"); }

  // защита
  const myAbsorb = rng(0, enStats.def);
  const enAbsorb = rng(0, myStats.def);
  const myTaken = Math.max(0, enDmg - enAbsorb);
  const enTaken = Math.max(0, myDmg - myAbsorb);

  enemy.hp = Math.max(0, enemy.hp - enTaken);
  me.hp    = Math.max(0, me.hp   - myTaken);
  logArr.push(`⚔️ Ты бьёшь на ${enTaken} (удар ${myDmg}, поглощено ${myAbsorb}). Соперник бьёт на ${myTaken} (удар ${enDmg}, поглощено ${enAbsorb}).`);
}

function consumeDurability(){
  for(const slot in S.equip){
    const e = S.equip[slot]; if(!e) continue;
    e.durability = Math.max(0, e.durability-1);
    if(e.durability<=0){
      const meta = GEAR_CRAFTS.find(g=>g.id===e.craftId);
      log("🛠 Сломалось: "+(meta?meta.name:slot));
      toast("Сломалось: "+(meta?meta.name:slot));
    }
  }
}

function runFight(meCopy, enemy){
  const logArr=[];
  let rounds=0;
  while(meCopy.hp>0 && enemy.hp>0 && rounds<20){
    attackRound(meCopy, enemy, logArr);
    rounds++;
  }
  const result = (meCopy.hp>0 && enemy.hp<=0) ? "win" :
                 (meCopy.hp<=0 && enemy.hp>0) ? "lose" :
                 (meCopy.hp<=0 && enemy.hp<=0) ? "draw0":"draw1";
  return {logArr, result, meHp:meCopy.hp, enHp:enemy.hp};
}

function fightAndApply(enemy, opts){
  opts = opts||{};
  // копируем чтобы не менять реальные значения по ходам
  const meCopy = {...S, equip:S.equip, mods:S.mods, band:S.band?{...S.band}:null};
  meCopy.hp = combatStats(S).hpMax;
  const enCopy = {...enemy};
  const r = runFight(meCopy, enCopy);

  // применяем итог
  S.hp = Math.max(0, r.meHp);
  if(r.result==="win"){ S.wins++; }
  else if(r.result==="lose"){ S.losses++; }

  if(r.result==="lose" || r.result==="draw0"){
    S.state = "reanim";
    log("⚠️ Жабка нуждается в реанимации!");
  }

  consumeDurability();
  if(S.band){
    S.band.loyalty = clamp(S.band.loyalty-2, 0, S.band.maxLoyalty||100);
  }
  return r;
}

/* ===================== ОСНОВНЫЕ ДЕЙСТВИЯ ===================== */

function applyXp(amount){
  S.fill += amount;
  while(S.fill >= S.fillNext){
    S.fill -= S.fillNext;
    S.level++;
    S.fillNext = 5 + S.level*2;
    S.hp = combatStats(S).hpMax;
    log("✨ Уровень "+S.level+"!");
    toast("Уровень "+S.level+"!");
    if(S.level>S.history.topLevel) S.history.topLevel = S.level;
  }
  save();
}

function feed(){
  if(S.state==="dead") return toast("Жаба мертва.");
  if(!ready(S.cd.feed)) return toast("Покормить можно через "+fmtCD(S.cd.feed));
  S.cd.feed = setCD(0.5); // 12ч → ~30 минут игровых
  applyXp(1);
  S.mood = clamp(S.mood+15, 0, S.moodMax);
  S.bugs += rng(20,55);
  if(S.state==="reanim" && chance(0.2)){ S.state="alive"; log("💊 Жабка очухалась после кормления."); }
  log("🍽 Покормил жабу: +1 сытость, +15 настроения");

  checkAchievements();
  save(); render();
}

  log("🍰 Откормил жабу за 500 буках: +5 сытости");

  save(); render();
}
function reanimate(){

function useLolipop(){

}

function workStart(kind){

  if(S.workActive) return toast("Жаба уже работает.");

  log("🧑‍🍳 Отправил на работу: "+kind);
  save(); render();
}
function workFinish(){
  const w = S.workActive;
  if(!w) return toast("Жаба не работает.");
  if(!ready(w.doneAt)) return toast("Работа завершится через "+fmtCD(w.doneAt));
  let report = ["🏁 Работа завершена:"];
  if(w.kind==="basic"){
    if(w.subkind==="canteen"){
      const b = rng(40,90); S.bugs+=b; report.push("+"+b+" букашек");
      if(chance(0.3)){ S.inv.snack++; report.push("+1 🍰"); }
      if(chance(0.1)){ S.inv.medkit++; report.push("+1 💊"); }
    } else if(w.subkind==="croupier"){
      const b = rng(80,210); S.bugs+=b; report.push("+"+b+" букашек");
      if(chance(0.3)){ S.inv.map++; report.push("+1 🗺"); }
      if(chance(0.2)){ S.inv.medkit++; report.push("+1 💊"); }
    } else if(w.subkind==="robber"){
      const b = rng(60,160); S.bugs+=b; report.push("+"+b+" букашек");
      if(chance(0.12) && !S.band){
        S.band = {type:"heron",loyalty:50,maxLoyalty:100};
        report.push("🦩 Тебе сошлась банда цапель!");
      }
      if(chance(0.15)){ S.state="reanim"; report.push("😵 Получил тумаков, нужна реанимация."); }
    }
  } else if(w.kind==="adv"){
    // adventure career: bonus per success
    const subk = w.subkind;
    const successes = rng(5,12);
    const b = rng(120,260); S.bugs+=b; report.push("+"+b+" букашек ("+successes+" успехов)");
    if(subk==="cafeteria"){
      if(chance(0.5)){ S.inv.snack += 2; report.push("+2 🍰"); }
    } else if(subk==="casino"){
      if(chance(0.5)){ S.inv.map++; report.push("+1 🗺"); }
      if(chance(0.3)){ S.inv.medkit++; report.push("+1 💊"); }
    } else if(subk==="bank"){
      if(chance(0.4)){ S.inv.gear++; report.push("+1 ⚙"); }
      if(chance(0.15) && !S.band){ S.band={type:"heron",loyalty:50,maxLoyalty:100}; report.push("🦩 Банда цапель!"); }
    }
  }
  S.workActive = null;
  S.cd.work = setCD(0.13); // ~8 мин (отдых) для теста
  S.daily.log.work = (S.daily.log.work||0)+1;
  log(report.join(" "));
  save(); render();
}

function arenaRegister(){
  if(S.state!=="alive") return toast("Не в форме.");
  if(S.arena.reg) return toast("Уже зарегистрирован.");
  if(!ready(S.cd.arenaReg)) return toast("Регистрация через "+fmtCD(S.cd.arenaReg));
  let cost=100;
  if(S.quickRegFreeLeft>0){ cost=0; S.quickRegFreeLeft--; }
  if(S.bugs<cost) return toast("Нужно "+cost+" буках.");
  S.bugs -= cost;
  S.arena.reg = true;
  S.arena.regTime = gameMinutes();
  S.arena.atk = false;
  S.cd.arenaReg = setCD(0.05);
  S.cd.arenaAtk = setCD(0.04);
  log("⚔️ Зарегистрирован на арене (стоимость "+cost+")");
  save(); render();
}
function arenaAttack(){
  if(!S.arena.reg) return toast("Сначала зарегистрируйся.");
  if(S.arena.atk) return toast("Уже атаковал в этом часу.");
  if(S.state!=="alive") return toast("Не в форме.");
  const opp = makeEnemy(S.level);
  const r = fightAndApply(opp);
  S.arena.atk = true;
  let payout=0, msg="";
  if(r.result==="win"){
    payout = rng(120,300);
    S.bugs += payout;
    S.arena.wins++;
    msg = "🏆 Победа на арене! +"+payout+" 🐞";
    if(chance(0.1)) { applyAmulet("am_heron"); msg+=" + 📿 Кулон цапель!"; }
    if(chance(0.4)){ S.inv.map++; msg+=" +1 🗺"; }
  } else if(r.result==="lose"){
    S.arena.losses++;
    msg = "💔 Поражение на арене.";
  } else { msg = "⚖️ Ничья на арене."; }
  log(msg+"\n"+r.logArr.join("\n"));
  S.daily.log.arena = (S.daily.log.arena||0)+1;
  // reset reg in 1 hour or now
  setTimeout(()=>{ S.arena.reg=false; S.arena.atk=false; save(); },50);
  showFightModal("Арена: "+opp.name+" ур."+opp.level, r);
  save();
}

function applyAmulet(id){
  const a = AMULETS.find(x=>x.id===id);
  if(!a) return;
  S.amulet = {id, expiresAt: setCD(a.days*24/24)}; // days→мин, чуть сжато: 24 ч игровых = 24 мин
  log("📿 Кулон активен: "+a.name);
}

/* ===================== ПОДЗЕМЕЛЬЕ ===================== */

function dungeonStart(id){
  const d = DUNGEONS.find(x=>x.id===id);
  if(!d) return;
  if(S.bugs<d.cost) return toast("Нужно "+d.cost+" буках.");
  if(S.state!=="alive") return toast("Не в форме.");
  if(!ready(S.cd.dungeon)) return toast("Подземелье через "+fmtCD(S.cd.dungeon));
  S.bugs -= d.cost;
  S.cd.dungeon = setCD(0.08);
  const boss = {
    name:d.boss, level:S.level+rng(0,3),
    atk:d.bossAtk, def:d.bossDef, hp:d.bossHp, hpMax:d.bossHp,
    photo:"👹", bandChance:0
  };
  const meCopy = {...S, equip:S.equip, mods:S.mods, band:S.band?{...S.band}:null};
  meCopy.hp = combatStats(S).hpMax;
  // ремесленник: больше урона по боссам
  if(S.cls==="artisan") boss.def = Math.max(0,boss.def-2);
  const r = runFight(meCopy, boss);
  S.hp = Math.max(0,r.meHp);
  if(r.result==="win"){
    S.wins++;
    log("🏰 Победа в "+d.name+" над "+d.boss);
    let drops=[];
    for(const k in d.drops){
      const v = d.drops[k];
      if(v<=1 && v>0){
        if(chance(v)){ S.inv[k]=(S.inv[k]||0)+1; drops.push("+1 "+k); }
      } else {
        S.inv[k]=(S.inv[k]||0)+v; drops.push("+"+v+" "+k);
      }
    }
    if(d.id==="event"){ S.inv.snow = (S.inv.snow||0)+rng(1,3); drops.push("+❄️"); }
    log("Награды: "+drops.join(", "));
    S.daily.log.dung = (S.daily.log.dung||0)+1;
    showFightModal("Подземелье: "+d.boss, r, drops);
  } else {
    consumeDurability();
    if(r.result==="lose") S.state="reanim";
    log("☠️ Поражение в "+d.name);
    showFightModal("Подземелье: "+d.boss, r);
  }
  save(); render();
}

function clanCreate(){
  const nm = prompt("Имя клана:", "Болотники");
  if(!nm) return;
  if(S.bugs<1500) return toast("Нужно 1500 буках.");
  S.bugs -= 1500;
  S.clan = {

      {name:"NPC-1 Лягвиния", level:rng(5,15)},
      {name:"NPC-2 Жабарь", level:rng(5,15)},
      {name:"NPC-3 Болотик", level:rng(5,15)},
      {name:"NPC-4 Квак",  level:rng(5,15)},
    ],
    lvl:1, exp:0, points:0, league:"wood", warAt:0, season:0, attacks:0, wins:0
  };
  log("🛡 Создан клан "+nm);
  save(); render();
}

function clanWar(){
  if(!S.clan) return toast("Нет клана.");
  if(S.inv.map<1 && S.inv.mapPrem<1) return toast("Нужна карта болота.");
  if(!ready(S.cd.mapCard)) return toast("Война через "+fmtCD(S.cd.mapCard));
  // расходуем карту
  if(S.inv.map>0) S.inv.map--; else S.inv.mapPrem--;
  // 4 NPC товарищи бьются параллельно, мы делаем свой бой
  const enemyClan = ["Зелёные","Прыгуны","Цапли-крёстные","Болотный синдикат"][rng(0,3)];
  const opp = makeEnemy(S.level+1);
  opp.name = enemyClan+" #"+rng(10,99);
  const r = fightAndApply(opp);
  let teamWins = (r.result==="win"?1:0);
  // npc-результаты
  for(const m of S.clan.members){
    if(chance(0.55)) teamWins++;
  }
  const totalWins = teamWins;
  const totalLoss = 5-totalWins;
  let pts=0;
  if(totalWins>totalLoss){ pts=3; S.clan.wins++; }
  else if(totalWins===totalLoss) pts=1;
  S.clan.points += pts;
  S.clan.attacks++;
  S.clan.exp += 30;
  if(S.clan.exp>=100*S.clan.lvl){ S.clan.exp=0; S.clan.lvl++; log("🛡 Клан повысил уровень → "+S.clan.lvl); }
  log(`⚔️ Война клана: ${totalWins}:${totalLoss} — +${pts} очк.`);
  S.cd.mapCard = setCD(0.13);
  showFightModal("Клановая война", r, [`Счёт: ${totalWins}:${totalLoss}`, `+${pts} клан-очк.`]);
  save();
}

function clanMapWalk(){
  if(!S.clan) return toast("Нет клана.");
  if(!ready(S.cd.mapCard)) return toast("Через "+fmtCD(S.cd.mapCard));
  S.cd.mapCard = setCD(0.13);
  if(chance(0.7)){ S.inv.map++; log("🗺 Принёс карту болота."); }
  else log("🚶 Заблудился, карты нет.");
  save(); render();
}

function roulette(amount, color){
  amount = parseInt(amount)||0;
  if(amount<10) return toast("Мин. ставка 10.");
  if(S.bugs<amount) return toast("Не хватает.");
  S.bugs -= amount;
  const roll = Math.random();
  let result, mult=0;
  if(roll<0.05){ result="green"; mult=14; }
  else if(roll<0.525){ result="red"; mult = color==="red"?1.5:0; }
  else { result="black"; mult = color==="black"?1.5:0; }
  if(color==="green" && result==="green") mult=14;
  const win = Math.floor(amount*mult);
  S.bugs += win;
  log(`🎰 Рулетка ${color}→${result}: ${win>0?"+":""}${win-amount} буках`);
  toast(`Выпало ${result}. ${win>0?"+"+win:"проигрыш"}`);
  save(); render();
}
function ksp(stake){
  stake = parseInt(stake)||0;
  if(stake<10) return toast("Мин. ставка 10.");
  if(S.bugs<stake) return toast("Не хватает.");
  const my = prompt("Камень (1), ножницы (2), бумага (3)?","1");
  if(!["1","2","3"].includes(my)) return;
  const npc = rng(1,3);
  let res;
  if(+my===npc) res="draw";
  else if((my==="1"&&npc===2)||(my==="2"&&npc===3)||(my==="3"&&npc===1)) res="win";
  else res="lose";
  if(res==="win"){ const w = Math.round(stake*0.9); S.bugs+=w; log("✊ КМН: победа +"+w); }
  else if(res==="lose"){ S.bugs-=stake; log("✊ КМН: поражение -"+stake); }
  else log("✊ КМН: ничья");
  save(); render();
}
function race(stake){
  stake = parseInt(stake)||0;
  if(stake<10) return toast("Мин. ставка 10.");
  if(S.bugs<stake) return toast("Не хватает.");

function craft(id){
  const c = GEAR_CRAFTS.find(g=>g.id===id);
  if(!c) return;
  for(const k in c.cost){
    if((k==="bugs"?S.bugs:(S.inv[k]||0)) < c.cost[k]){
      return toast("Не хватает "+k);
    }
  }
  for(const k in c.cost){
    if(k==="bugs") S.bugs -= c.cost[k];
    else S.inv[k] -= c.cost[k];
  }
  S.equip[c.slot] = {craftId:c.id, durability:c.dur};
  log("🔨 Скрафтил: "+c.name);
  save(); render();
}
function repair(slot){
  const e = S.equip[slot]; if(!e) return;
  const meta = GEAR_CRAFTS.find(g=>g.id===e.craftId);
  if(!meta) return;
  if(e.durability<=0) return toast("Сломано окончательно.");
  const cost = Math.max(20, meta.cost.bugs*0.1)|0;
  if(S.bugs<cost) return toast("Нужно "+cost+" буках.");
  S.bugs -= cost;
  e.durability = Math.min(meta.dur, e.durability+3);
  log("🛠 Починил "+meta.name+" за "+cost+" 🐞");
  save(); render();
}
function applyMod(slot, mod){
  if(S.gems<1) return toast("Нет жабогемов.");
  S.mods[slot] = S.mods[slot]||[];
  if(S.mods[slot].length>=3) return toast("Уже 3 модификатора.");
  S.gems--;
  S.mods[slot].push(mod);
  log("💠 Модификатор "+mod+" → "+slot);
  save(); render();
}

function checkAchievements(){
  for(const a of ACH_DEFS){
    let v=0;
    if(a.type==="feed") v=S.daily.log._allFeed = (S.daily.log._allFeed||0);
    else if(a.type==="wins") v=S.wins;
    else if(a.type==="bugs") v=Math.max(S.bugs, S.history.topBugs||0);
    else if(a.type==="level") v=S.level;
    else if(a.type==="clanWins") v=S.clan?S.clan.wins:0;
    else if(a.type==="champion") v=S.history.championLvl||0;
    let tier=0;
    for(let i=0;i<3;i++) if(v>=a.tiers[i]) tier=i+1;
    if(tier > (S.achievements[a.id]||0)){
      S.achievements[a.id]=tier;
      log("🏅 Получена ачивка "+a.name+" "+["бронза","серебро","золото"][tier-1]);
      if(tier===3){ S.inv.expcap++; log("🔋 +1 капсула опыта"); }
    }
  }
  if(S.bugs>S.history.topBugs) S.history.topBugs = S.bugs;
}

/* ===================== ДЕЙЛИКИ ===================== */

function rolloverDaily(){
  const day = Math.floor(gameMinutes()/120); // "сутки" = 2 минуты игровых = 120 игровых минут? нет.
  // Упростим: каждые 240 игровых минут (≈ 4 реальных) — новый день
  const realDay = Math.floor(gameMinutes()/240);
  if(S.daily.date!==realDay){
    if(S.daily.date!==0){
      // оценим вчерашний прогресс
      let allDone = true;
      for(const d of DAILIES){
        const v = S.daily.log[d.type]||0;
        if(v<d.need){ allDone=false; break; }
      }
      if(allDone){
        S.daily.streak++;
        if(S.daily.streak>=14) S.daily.status="gold";
        else if(S.daily.streak>=7) S.daily.status="silver";
        else if(S.daily.streak>=3) S.daily.status="bronze";
        else S.daily.status="green";
      } else { S.daily.streak=0; S.daily.status="green"; }
    }
    S.daily.date = realDay;
    S.daily.log = {_allFeed: S.daily.log._allFeed||0};
    S.daily.claimed = {};
    log("🗓 Новый день. Дейлики обновлены.");
  }
}

function claimDaily(id){
  const d = DAILIES.find(x=>x.id===id);
  if(!d) return;
  if(S.daily.claimed[id]) return toast("Уже забрано.");
  const v = S.daily.log[d.type]||0;
  if(v<d.need) return toast("Условие не выполнено.");
  S.daily.claimed[id]=1;
  for(const k in d.reward){
    if(k==="bugs") S.bugs+=d.reward[k];
    else if(k==="gems") S.gems = clamp(S.gems+d.reward[k],0,50);
    else S.inv[k]=(S.inv[k]||0)+d.reward[k];
  }
  if(S.daily.status==="silver") S.inv.map++;
  if(S.daily.status==="gold") S.inv.tape++;
  if(S.daily.status==="bronze") S.gems = clamp(S.gems+1,0,50);
  log("🎁 Дейли: "+d.txt);
  save(); render();
}

  S.band.loyalty = clamp(S.band.loyalty+10, 0, S.band.maxLoyalty||100);
  log("🏋️ Банда довольна: +10 верности");
  save(); render();
}

function getTopBoard(){
  // случайные NPC + игрок
  const pool = [];
  for(let i=0;i<9;i++){
    pool.push({name:pick(["Барсук","Шрек","Тритон","Кваквон","Жабэн","Лиля","Пепе","Лягуш","Прыг","Гермиона"])+" #"+rng(10,99), wins:rng(5,80), level:rng(5,40)});
  }
  pool.push({name:"⭐ "+S.name+" (ты)", wins:S.wins+rng(0,2), level:S.level});
  pool.sort((a,b)=>b.wins-a.wins);
  return pool.slice(0,10);
}

      <div class="desc">Цена: ${Object.entries(c.cost).map(([k,v])=>v+" "+(k==="bugs"?"🐞":k==="herb"?"🌿":k==="lily"?"🥬":k==="beak"?"🦴":"⚙")).join(", ")}</div>
      <button class="btn" onclick="craft('${c.id}')" ${can?"":"disabled"}>Скрафтить</button>
    </div>`;
  });
  crafts += `</div></div>`;

  let amuletPanel = `<div class="panel"><h2>📿 Кулоны</h2><div class="grid3">`;
  AMULETS.forEach(a=>{
    const can = S.bugs>=(a.cost.bugs||0) && (!a.cost.gear||S.inv.gear>=a.cost.gear) && (!a.cost.beak||S.inv.beak>=a.cost.beak);
    amuletPanel += `<div class="item">
      <div class="name">${a.name}</div>
      <div class="desc">Банда +${(a.bandDmgBonus*100).toFixed(0)}% урон, +${a.bandMaxBonus} макс верности, ${a.days} дней</div>
      <div class="desc">Цена: ${Object.entries(a.cost).map(([k,v])=>v+" "+(k==="bugs"?"🐞":k==="gear"?"⚙":"🦴")).join(", ")}</div>
      <button class="btn" onclick="craftAmulet('${a.id}')" ${can?"":"disabled"}>Скрафтить</button>
    </div>`;
  });
  amuletPanel += `</div></div>`;

  return `<div class="head-grad">${petCardHtml()}</div>${equipped}${crafts}${amuletPanel}`;
}

function craftAmulet(id){
  const a = AMULETS.find(x=>x.id===id);
  if(!a) return;
  for(const k in a.cost){
    if((k==="bugs"?S.bugs:(S.inv[k]||0))<a.cost[k]) return toast("Не хватает "+k);
  }
  for(const k in a.cost){
    if(k==="bugs") S.bugs-=a.cost[k]; else S.inv[k]-=a.cost[k];
  }
  applyAmulet(id);
  save(); render();
}

function viewInv(){
  const INV_LABELS = {
    medkit:"💊 Аптечки", candy:"🍬 Конфетки", lolipop:"🍭 Леденцы",
    expcap:"🔋 Капсулы опыта", snack:"🍰 Сытность",
    herb:"🌿 Водоросли", lily:"🥬 Кувшинки", beak:"🦴 Кусочки клюва цапли",
    gear:"⚙ Оружейные кусочки", tape:"🧿 Изолента",
    map:"🗺 Карты болота", mapPrem:"🌌 Несгораемые карты",
    beer:"🍺 Пивас", dragonfly:"🦟 Стрекозюля удачи",
    frogling:"🐸 Жабульки (в банду)", snow:"❄️ Снежинки",
    jewelbug:"🪲 Драгоценный жучок",
  };
  let inv = `<div class="panel"><h2>🎒 Инвентарь</h2><div class="grid3">`;
  for(const k in INV_LABELS){
    inv += `<div class="item"><div class="name">${INV_LABELS[k]}</div><div class="desc">x ${S.inv[k]||0}</div></div>`;
  }
  inv += `</div></div>`;
  inv += `<div class="panel"><h2>💠 Жабогемы: ${S.gems}/50</h2>
    <p class="help">Падают за клановый сезон и из золотых дейликов. Тратятся на модификаторы брони.</p>
  </div>`;
  return `<div class="head-grad">${petCardHtml()}</div>${inv}`;
}

  <div class="panel"><h2>💸 Донат-баланс</h2>

    <div class="row">
      <button class="btn" onclick="donate(100)">+100₽ (тест)</button>

      <button class="btn alt" onclick="donate(1000)">+1000₽ (тест)</button>
    </div>

  </div>
  <div class="panel"><h2>👑 Prime (89₽)</h2>
    <p class="help">Кормёжка чаще, бесплатные смены имени, своя фотка и т.п.</p>
    <button class="btn" onclick="buyPrime()" ${S.history.prime?"disabled":""}>${S.history.prime?"Куплено":"Купить Prime"}</button>

  </div></div>
  <div class="panel"><h2>🛒 Магазин букашек</h2><div class="grid3">
    <div class="item"><div class="name">💊 Аптечка (300)</div><button class="btn" onclick="buyPrem('medkit')">Купить</button></div>
    <div class="item"><div class="name">🍭 Леденец (300)</div><button class="btn" onclick="buyPrem('lolipop')">Купить</button></div>
    <div class="item"><div class="name">🍺 Пивас (750) — навсегда</div>
      <button class="btn" onclick="buyPrem('beer')" ${S.inv.beer?"disabled":""}>${S.inv.beer?"Куплено":"Купить"}</button></div>
    <div class="item"><div class="name">🦟 Стрекозюля (2000) — +10% 🐞 навсегда</div>
      <button class="btn" onclick="buyPrem('dragonfly')" ${S.inv.dragonfly?"disabled":""}>${S.inv.dragonfly?"Куплено":"Купить"}</button></div>
    <div class="item"><div class="name">🌌 Карта (20₽)</div>
      <button class="btn" onclick="buyPrem('map')">Купить</button></div>
  </div></div>
  <div class="panel"><h2>💱 Конвертация рублей в букашки (35 🐞/₽)</h2>
    <div class="row">
      <input class="mini-input" id="rubAmt" type="number" value="50">
      <button class="btn" onclick="rubToBugs(document.getElementById('rubAmt').value)">Конвертировать</button>
    </div>

  <div class="panel"><h2>🔁 Конвертер ресурсов</h2>
    <p class="help">10 водорослей → 1 кувшинка · 10 кувшинок → 1 кусочек цапли.</p>
    <div class="row">
      <button class="btn alt" onclick="convert('herb','lily',10,1)">10 🌿 → 1 🥬</button>
      <button class="btn alt" onclick="convert('lily','beak',10,1)">10 🥬 → 1 🦴</button>
    </div>
  </div>

    <button class="btn warn" onclick="resurrect()">Воскресить</button>
  </div>`;
}

function convert(from,to,a,b){
  if((S.inv[from]||0)<a) return toast("Не хватает "+from);
  S.inv[from]-=a;
  S.inv[to]=(S.inv[to]||0)+b;
  log("🔁 "+a+" "+from+" → "+b+" "+to);
  save(); render();
}

function viewDaily(){
  let block = `<div class="panel"><h2>📋 Дейлики · Статус: <span class="pill ${S.daily.status==="gold"?"gold":S.daily.status==="silver"?"":S.daily.status==="bronze"?"":"good"}">${ {green:"💚 Зелёный",bronze:"🧡 Бронзовый",silver:"🤍 Серебряный",gold:"💛 Золотой"}[S.daily.status] }</span> · Серия: ${S.daily.streak}</h2>
    <div class="grid2">`;
  for(const d of DAILIES){
    const v = S.daily.log[d.type]||0;
    const done = v>=d.need;
    const claimed = !!S.daily.claimed[d.id];
    block += `<div class="item"><div class="name">${d.txt}</div>
      <div class="desc">${v}/${d.need}${done?" ✅":""}${claimed?" · забрано":""}</div>
      <div class="desc">Награда: ${Object.entries(d.reward).map(([k,v])=>v+" "+(k==="bugs"?"🐞":k==="gems"?"💠":k)).join(", ")}</div>
      <button class="btn" onclick="claimDaily('${d.id}')" ${done&&!claimed?"":"disabled"}>${claimed?"Забрано":"Получить"}</button>
    </div>`;
  }
  block += `</div></div>`;

  let ach = `<div class="panel"><h2>🏅 Ачивки</h2><div class="ach-grid">`;
  for(const a of ACH_DEFS){
    const t = S.achievements[a.id]||0;
    const cls = t===3?"g":t===2?"s":t===1?"b":"";
    ach += `<div class="ach ${cls}">
      <div class="n">${a.name}</div>
      <div style="color:var(--muted)">Бронза ${a.tiers[0]} · Серебро ${a.tiers[1]} · Золото ${a.tiers[2]}</div>
      <div>Текущий: <b>${["—","🥉 бронза","🥈 серебро","🥇 золото"][t]}</b></div>
    </div>`;
  }
  ach += `</div></div>`;
  return `${block}${ach}`;
}

function viewChat(){
  return `<div class="panel"><h2>💬 Чат-лог (имитация ленты бота)</h2>
    <div class="log">${S.log.map(l=>`<div class="l">${l}</div>`).join("")||"<i>Пусто</i>"}</div>
  </div>`;
}

function viewSets(){
  return `<div class="panel"><h2>⚙ Настройки</h2>
    <div class="row" style="gap:14px;flex-direction:column">
      <label><input type="checkbox" ${S.settings.fastBattle?"checked":""} onclick="S.settings.fastBattle=this.checked;save()"> Быстрые сражения</label>
      <label><input type="checkbox" ${S.settings.deleteOld?"checked":""} onclick="S.settings.deleteOld=this.checked;save()"> Удалять старые сообщения чата</label>
    </div>
    <h3>Фото жабы</h3>
    <div class="row">
      ${["🐸","🐊","🦎","🐢","🦗","🪲","🐍"].map(e=>`<button class="btn small alt" onclick="S.photo='${e}';save();render()">${e}</button>`).join("")}
    </div>
    <h3>Сохранение</h3>
    <div class="row">
      <button class="btn alt" onclick="exportSave()">Экспорт</button>
      <button class="btn alt" onclick="importSave()">Импорт</button>
      <button class="btn bad" onclick="reset()">Сбросить игру</button>
    </div>
    <p class="help">Игра сохраняется в localStorage автоматически. Это локальная аналогия Жабабота — без сети, всё в одном файле. Все таймеры сжаты: «час» бота = ~1 игровая минута = 1 реальная секунда × 60.</p>
  </div>`;
}
function exportSave(){
  navigator.clipboard?.writeText(JSON.stringify(S));
  toast("Сохранение скопировано в буфер.");
}
function importSave(){
  const t = prompt("Вставь JSON сохранения:");
  if(!t) return;
  try{ const s = JSON.parse(t); localStorage.setItem(SAVE_KEY,JSON.stringify(s)); location.reload(); }catch(e){ toast("Битый JSON"); }
}

function render(){
  renderTabs();
  renderHud();
  const v = document.getElementById("view");
  let html="";
  switch(currentTab){
    case "pet": html=viewPet(); break;
    case "work": html=viewWork(); break;
    case "fight": html=viewFight(); break;
    case "clan": html=viewClan(); break;
    case "family": html=viewFamily(); break;
    case "games": html=viewGames(); break;
    case "gear": html=viewGear(); break;
    case "inv": html=viewInv(); break;
    case "shop": html=viewShop(); break;
    case "daily": html=viewDaily(); break;
    case "chat": html=viewChat(); break;
    case "sets": html=viewSets(); break;
  }
  v.innerHTML = html;
}

/* ===================== ИНИЦИАЛИЗАЦИЯ ===================== */

function init(){
  S = load() || defaultState();
  if(!S.startedAt) S.startedAt = now();
  if(!S.daily) S.daily={date:0,log:{},claimed:{},streak:0,status:"green"};
  if(!S.history) S.history={};
  if(!S.inv) S.inv={};
  if(!S.equip) S.equip={};
  if(!S.mods) S.mods={};
  if(!S.settings) S.settings={};
  if(typeof S.quickRegFreeLeft!=="number") S.quickRegFreeLeft=10;
  // экспонируем для onclick
  window.feed=feed; window.force=force; window.reanimate=reanimate;
  window.useLolipop=useLolipop; window.useCapsule=useCapsule;
  window.renameFrog=renameFrog; window.workStart=workStart;
  window.workFinish=workFinish; window.adventureStart=adventureStart;
  window.arenaRegister=arenaRegister; window.arenaAttack=arenaAttack;
  window.dungeonStart=dungeonStart; window.clanCreate=clanCreate;
  window.clanWar=clanWar; window.clanMapWalk=clanMapWalk;
  window.marryNPC=marryNPC; window.divorce=divorce;
  window.brakReward=brakReward; window.checkFaith=checkFaith;
  window.adoptChild=adoptChild; window.feedChild=feedChild;
  window.kindergarten=kindergarten; window.pickupChild=pickupChild;
  window.childBrawl=childBrawl;
  window.roulette=roulette; window.ksp=ksp; window.race=race;
  window.party=party; window.robbery=robbery; window.duel=duel;
  window.craft=craft; window.repair=repair; window.applyMod=applyMod;
  window.buyChest=buyChest; window.buyPrem=buyPrem; window.donate=donate;
  window.rubToBugs=rubToBugs; window.buyPrime=buyPrime; window.resurrect=resurrect;
  window.pickClass=pickClass; window.classUp=classUp; window.changeClass=changeClass;
  window.rp=rp; window.takeFrog=takeFrog; window.feedBand=feedBand;
  window.dailyJaba=dailyJaba; window.craftAmulet=craftAmulet;
  window.convert=convert; window.closeModal=closeModal;
  window.exportSave=exportSave; window.importSave=importSave;
  window.reset=reset; window.claimDaily=claimDaily;
  window.S=S;
  render();
  setInterval(()=>{ tick(); if(document.getElementById("view").innerHTML) renderHud(); }, TICK_MS);
  setInterval(()=>{ render(); }, 5000);
  log("🐸 Игра запущена. Добро пожаловать в HTML-болото!");
}
init();
</script>
